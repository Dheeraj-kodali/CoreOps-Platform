version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: temple_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: temple_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: temple_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: temple_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/temple_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/temple_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=production-temple-secret-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: temple_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/temple_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: temple_admin
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: temple_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin

volumes:
  postgres_data:
